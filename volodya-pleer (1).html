<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Володя Плеёр ^_^</title>
<style>
  :root{
    --bg:#0b0b10;
    --bg2:#131320;
    --panel:#15151f;
    --text:#eef0f5;
    --muted:#8a8a9a;
    --accent:#7c5cff;
    --accent2:#38e0c8;
    --line:#26263a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--bg2), var(--bg) 60%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 14px calc(18px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  @font-face{
    font-family:'Space Grotesk';
    src:local('Space Grotesk');
  }

  .app{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:4px 2px 0;
  }
  header h1{
    font-size:17px;
    font-weight:600;
    letter-spacing:0.2px;
    margin:0;
  }
  header .sub{
    font-size:12px;
    color:var(--muted);
  }

  .stage{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:22px;
    background:var(--panel);
    border:1px solid var(--line);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  canvas{
    width:100%;
    height:100%;
    display:block;
  }
  .drop-hint{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding:24px;
    pointer-events:none;
  }
  .drop-hint svg{opacity:0.5;}
  .drop-hint b{color:var(--text); font-weight:600;}

  .track-info{
    text-align:center;
    padding:0 8px;
  }
  .track-info .name{
    font-size:15px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-info .time{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }

  .seek{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:4px;
    border-radius:4px;
    background:var(--line);
    outline:none;
    cursor:pointer;
  }
  .seek::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px;height:14px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent);
    cursor:pointer;
  }
  .seek::-moz-range-thumb{
    width:14px;height:14px;border:none;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent);
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
  }
  .ctrl-btn{
    background:none;
    border:none;
    color:var(--text);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6px;
  }
  .ctrl-btn.play{
    width:58px;height:58px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    color:#0b0b10;
  }
  .ctrl-btn svg{width:22px;height:22px;}
  .ctrl-btn.play svg{width:24px;height:24px;}

  .file-row{
    display:flex;
    gap:10px;
  }
  .file-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px 14px;
    border-radius:12px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    font-size:13px;
    font-weight:500;
    cursor:pointer;
  }
  .file-btn svg{width:16px;height:16px; opacity:0.8;}
  #fileInput{display:none;}

  .panel-toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    cursor:pointer;
    font-size:13px;
    font-weight:500;
  }
  .panel-toggle svg{
    width:16px;height:16px;
    transition:transform 0.2s;
  }
  .panel-toggle.open svg{transform:rotate(180deg);}

  .settings{
    display:none;
    flex-direction:column;
    gap:16px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
  }
  .settings.open{display:flex;}

  .field{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .field label{
    font-size:12px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
  }
  .styles{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:8px;
  }
  .style-opt{
    padding:9px 4px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--bg2);
    color:var(--muted);
    font-size:11px;
    text-align:center;
    cursor:pointer;
  }
  .style-opt.active{
    border-color:var(--accent);
    color:var(--text);
    background:color-mix(in srgb, var(--accent) 16%, var(--bg2));
  }

  .colors{
    display:flex;
    gap:10px;
  }
  .color-field{
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--bg2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:6px 10px;
  }
  .color-field input[type=color]{
    width:26px;height:26px;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
  }
  .color-field span{font-size:11px; color:var(--muted);}

  input[type=range].mini{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:4px;
    border-radius:4px;
    background:var(--line);
    outline:none;
  }
  input[type=range].mini::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px;height:14px;
    border-radius:50%;
    background:var(--text);
    cursor:pointer;
  }

  .bg-opts{
    display:flex;
    gap:8px;
  }
  .bg-opt{
    width:30px;height:30px;
    border-radius:8px;
    border:2px solid transparent;
    cursor:pointer;
  }
  .bg-opt.active{border-color:var(--accent);}

  audio{display:none;}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Володя Плеёр :)</h1>
    <span class="sub">свой визуал ^_^</span>
  </header>

  <div class="stage" id="stage">
    <canvas id="viz"></canvas>
    <div class="drop-hint" id="hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <div><b>Трек не загружен :(</b><br>Закинь mp3-файл ниже, я жду ^_^</div>
    </div>
  </div>

  <div class="track-info">
    <div class="name" id="trackName">Ничего не играет :(</div>
    <div class="time" id="trackTime">0:00 / 0:00</div>
  </div>

  <input type="range" class="seek" id="seek" min="0" max="100" value="0">

  <div class="controls">
    <button class="ctrl-btn" id="backBtn" title="-10 сек ^_^">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 5V1L4 7l7 6V9c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H3c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
    </button>
    <button class="ctrl-btn play" id="playBtn" title="Играть :)">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctrl-btn" id="fwdBtn" title="+10 сек ^_^">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 5V1l7 6-7 6V9c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
    </button>
  </div>

  <div class="file-row">
    <button class="file-btn" id="pickBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
      Загрузить mp3 ;)
    </button>
    <input type="file" id="fileInput" accept="audio/*">
  </div>

  <div class="panel-toggle" id="panelToggle">
    <span>Настройки визуала :)</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
  </div>

  <div class="settings" id="settings">
    <div class="field">
      <label>Стиль визуализации ^_^</label>
      <div class="styles" id="styleOpts">
        <div class="style-opt active" data-style="bars">Столбики</div>
        <div class="style-opt" data-style="wave">Волна</div>
        <div class="style-opt" data-style="circle">Круг</div>
        <div class="style-opt" data-style="particles">Частицы</div>
      </div>
    </div>

    <div class="field">
      <label>Цвета :)</label>
      <div class="colors">
        <div class="color-field">
          <input type="color" id="color1" value="#7c5cff">
          <span>Основной</span>
        </div>
        <div class="color-field">
          <input type="color" id="color2" value="#38e0c8">
          <span>Второй</span>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Фон сцены ;)</label>
      <div class="bg-opts" id="bgOpts">
        <div class="bg-opt active" data-bg="dark" style="background:#15151f"></div>
        <div class="bg-opt" data-bg="black" style="background:#000000"></div>
        <div class="bg-opt" data-bg="navy" style="background:#0d1321"></div>
        <div class="bg-opt" data-bg="plum" style="background:#1a1024"></div>
      </div>
    </div>

    <div class="field">
      <label>^_^ Чувствительность <span id="sensVal">1.0</span></label>
      <input type="range" class="mini" id="sensitivity" min="0.4" max="2.5" step="0.1" value="1">
    </div>

    <div class="field">
      <label>~ Плавность <span id="smoothVal">0.8</span></label>
      <input type="range" class="mini" id="smoothing" min="0" max="0.95" step="0.05" value="0.8">
    </div>

    <div class="field">
      <label>Количество элементов <span id="barsVal">64</span> )))</label>
      <input type="range" class="mini" id="barCount" min="16" max="128" step="8" value="64">
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script>
(function(){
  const audio = document.getElementById('audio');
  const fileInput = document.getElementById('fileInput');
  const pickBtn = document.getElementById('pickBtn');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const backBtn = document.getElementById('backBtn');
  const fwdBtn = document.getElementById('fwdBtn');
  const seek = document.getElementById('seek');
  const trackName = document.getElementById('trackName');
  const trackTime = document.getElementById('trackTime');
  const hint = document.getElementById('hint');
  const canvas = document.getElementById('viz');
  const ctx = canvas.getContext('2d');
  const panelToggle = document.getElementById('panelToggle');
  const settings = document.getElementById('settings');

  let audioCtx, analyser, source, dataArray, bufferLength;
  let vizStyle = 'bars';
  let color1 = '#7c5cff', color2 = '#38e0c8';
  let sensitivity = 1.0, smoothing = 0.8, barCount = 64;
  let particles = [];
  let rafId;

  function resizeCanvas(){
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function initAudioContext(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.smoothingTimeConstant = smoothing;
    source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    analyser.fftSize = 256;
    bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);
  }

  pickBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    const f = e.target.files[0];
    if(!f) return;
    loadFile(f);
  });

  function loadFile(f){
    const url = URL.createObjectURL(f);
    audio.src = url;
    trackName.textContent = f.name.replace(/\.[^/.]+$/, '');
    hint.style.display = 'none';
    initAudioContext();
    audio.play().catch(()=>{});
  }

  playBtn.addEventListener('click', () => {
    if(!audio.src) { fileInput.click(); return; }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if(audio.paused){ audio.play(); } else { audio.pause(); }
  });

  audio.addEventListener('play', () => {
    playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
    if(!rafId) draw();
  });
  audio.addEventListener('pause', () => {
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  });

  backBtn.addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
  fwdBtn.addEventListener('click', () => { audio.currentTime = Math.min(audio.duration||0, audio.currentTime + 10); });

  seek.addEventListener('input', () => {
    if(audio.duration) audio.currentTime = (seek.value/100) * audio.duration;
  });

  function fmt(t){
    if(!isFinite(t)) return '0:00';
    const m = Math.floor(t/60), s = Math.floor(t%60);
    return m + ':' + (s<10?'0':'') + s;
  }

  audio.addEventListener('timeupdate', () => {
    if(audio.duration){
      seek.value = (audio.currentTime/audio.duration)*100;
      trackTime.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
    }
  });

  // settings interactions
  panelToggle.addEventListener('click', () => {
    settings.classList.toggle('open');
    panelToggle.classList.toggle('open');
  });

  document.getElementById('styleOpts').addEventListener('click', (e) => {
    const opt = e.target.closest('.style-opt');
    if(!opt) return;
    document.querySelectorAll('.style-opt').forEach(o => o.classList.remove('active'));
    opt.classList.add('active');
    vizStyle = opt.dataset.style;
    if(vizStyle === 'particles') initParticles();
  });

  document.getElementById('color1').addEventListener('input', e => color1 = e.target.value);
  document.getElementById('color2').addEventListener('input', e => color2 = e.target.value);

  document.getElementById('bgOpts').addEventListener('click', (e) => {
    const opt = e.target.closest('.bg-opt');
    if(!opt) return;
    document.querySelectorAll('.bg-opt').forEach(o => o.classList.remove('active'));
    opt.classList.add('active');
    const map = {dark:'#15151f', black:'#000000', navy:'#0d1321', plum:'#1a1024'};
    document.getElementById('stage').style.background = map[opt.dataset.bg];
  });

  const sensSlider = document.getElementById('sensitivity');
  sensSlider.addEventListener('input', e => {
    sensitivity = parseFloat(e.target.value);
    document.getElementById('sensVal').textContent = sensitivity.toFixed(1);
  });

  const smoothSlider = document.getElementById('smoothing');
  smoothSlider.addEventListener('input', e => {
    smoothing = parseFloat(e.target.value);
    document.getElementById('smoothVal').textContent = smoothing.toFixed(2);
    if(analyser) analyser.smoothingTimeConstant = smoothing;
  });

  const barSlider = document.getElementById('barCount');
  barSlider.addEventListener('input', e => {
    barCount = parseInt(e.target.value);
    document.getElementById('barsVal').textContent = barCount;
  });

  function initParticles(){
    particles = [];
    for(let i=0;i<80;i++){
      particles.push({
        angle: Math.random()*Math.PI*2,
        radius: 20 + Math.random()*60,
        speed: 0.001 + Math.random()*0.004,
        size: 1 + Math.random()*2.5
      });
    }
  }
  initParticles();

  function lerpColor(a, b, t){
    const ah = parseInt(a.slice(1),16), bh = parseInt(b.slice(1),16);
    const ar = (ah>>16)&255, ag=(ah>>8)&255, ab=ah&255;
    const br = (bh>>16)&255, bg=(bh>>8)&255, bb=bh&255;
    const rr = Math.round(ar+(br-ar)*t), rg = Math.round(ag+(bg-ag)*t), rb = Math.round(ab+(bb-ab)*t);
    return `rgb(${rr},${rg},${rb})`;
  }

  function draw(){
    rafId = requestAnimationFrame(draw);
    const rect = canvas.getBoundingClientRect();
    const W = rect.width, H = rect.height;
    ctx.clearRect(0,0,W,H);

    if(!analyser){ return; }
    analyser.getByteFrequencyData(dataArray);

    if(vizStyle === 'bars'){
      const n = Math.min(barCount, bufferLength);
      const gap = 3;
      const bw = (W - gap*(n-1)) / n;
      let x = 0;
      for(let i=0;i<n;i++){
        const idx = Math.floor(i * bufferLength / n);
        let v = (dataArray[idx]/255) * sensitivity;
        v = Math.min(v, 1);
        const h = v * H * 0.85;
        const grad = ctx.createLinearGradient(0, H-h, 0, H);
        grad.addColorStop(0, color2);
        grad.addColorStop(1, color1);
        ctx.fillStyle = grad;
        const r = Math.min(bw/2, 6);
        roundRect(ctx, x, H-h, bw, h, r);
        ctx.fill();
        x += bw+gap;
      }
    } else if(vizStyle === 'wave'){
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = color1;
      ctx.beginPath();
      const n = Math.min(barCount, bufferLength);
      for(let i=0;i<n;i++){
        const idx = Math.floor(i * bufferLength / n);
        let v = (dataArray[idx]/255 - 0.5) * sensitivity;
        const x = (i/(n-1)) * W;
        const y = H/2 + v * H*0.7;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
      ctx.lineWidth = 1;
      ctx.strokeStyle = color2;
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      for(let i=0;i<n;i++){
        const idx = Math.floor(i * bufferLength / n);
        let v = (dataArray[idx]/255 - 0.5) * sensitivity * 0.6;
        const x = (i/(n-1)) * W;
        const y = H/2 + v * H*0.7 + 10;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if(vizStyle === 'circle'){
      const cx = W/2, cy = H/2;
      const baseR = Math.min(W,H)*0.22;
      const n = Math.min(barCount, bufferLength);
      for(let i=0;i<n;i++){
        const idx = Math.floor(i * bufferLength / n);
        let v = (dataArray[idx]/255) * sensitivity;
        v = Math.min(v,1);
        const len = v * Math.min(W,H)*0.28;
        const a = (i/n) * Math.PI*2;
        const x1 = cx + Math.cos(a)*baseR;
        const y1 = cy + Math.sin(a)*baseR;
        const x2 = cx + Math.cos(a)*(baseR+len);
        const y2 = cy + Math.sin(a)*(baseR+len);
        ctx.strokeStyle = lerpColor(color1, color2, i/n);
        ctx.lineWidth = Math.max(2, (Math.PI*2*baseR/n)*0.6);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x1,y1);
        ctx.lineTo(x2,y2);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(cx,cy,baseR*0.7,0,Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.03)';
      ctx.fill();
    } else if(vizStyle === 'particles'){
      const cx = W/2, cy = H/2;
      let avg = 0;
      for(let i=0;i<bufferLength;i++) avg += dataArray[i];
      avg = (avg/bufferLength/255) * sensitivity;
      particles.forEach((p,i) => {
        const idx = i % bufferLength;
        let v = (dataArray[idx]/255) * sensitivity;
        p.angle += p.speed * (1+avg*2);
        const r = p.radius + v*Math.min(W,H)*0.35;
        const x = cx + Math.cos(p.angle)*r;
        const y = cy + Math.sin(p.angle)*r;
        ctx.beginPath();
        ctx.arc(x,y,p.size + v*4,0,Math.PI*2);
        ctx.fillStyle = lerpColor(color1,color2, i/particles.length);
        ctx.globalAlpha = 0.5 + v*0.5;
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // idle animation before a track is loaded
  function idleDraw(){
    if(audioCtx) return;
    const rect = canvas.getBoundingClientRect();
    const W = rect.width, H = rect.height;
    ctx.clearRect(0,0,W,H);
    requestAnimationFrame(idleDraw);
  }
  idleDraw();

})();
</script>
</body>
</html>
